name: Build Windows Package

on:
  push:
    branches:
      - dev1
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # GitHub-hosted Windows runner (Visual Studio 2022)
    runs-on: windows-2022

    defaults:
      run:
        shell: powershell

    env:
      BUILD_TYPE: Release
      CMAKE_GENERATOR: Visual Studio 17 2022
      CMAKE_ARCH: x64
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.13
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Cache virtual environment
        id: cache-venv
        uses: actions/cache@v4
        with:
          path: .env
          key: ${{ runner.os }}-venv-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

      - name: Cache status
        run: |
          if ("${{ steps.cache-venv.outputs.cache-hit }}" -eq "true") {
            Write-Host "Cache status: venv HIT"
          } elseif ("${{ steps.cache-venv.outputs.cache-hit }}" -eq "false") {
            Write-Host "Cache status: venv MISS"
          } else {
            Write-Host "Cache status: venv UNKNOWN (${{ steps.cache-venv.outputs.cache-hit }})"
          }

      - name: Ensure MSBuild in PATH
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: "[17.0,18.0)"

      - name: Create virtual environment
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv .env

      - name: Install Python dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          .\.env\Scripts\python -m pip install --upgrade pip
          .\.env\Scripts\python -m pip install -r requirements.txt

      - name: Build all-in-one executable
        run: |
          .\.env\Scripts\python build.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: datapacker-windows
          path: |
            datapacker.exe
          if-no-files-found: error

      - name: Publish prerelease (dev1)
        if: github.ref == 'refs/heads/dev1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev1-${{ github.run_id }}
          target_commitish: ${{ github.sha }}
          name: dev1 prerelease ${{ github.run_number }}
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            datapacker.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release (tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          generate_release_notes: true
          files: |
            datapacker.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
